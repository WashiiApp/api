spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres}
    username: ${DB_USERNAME:postgres.${SUPABASE_PROJECT_REF}}
    password: ${DB_PASSWORD:${PASSWORD}}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/.well-known/jwks.json
          issuer-uri: https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1
  cache:
    type: redis
    redis:
      time-to-live: 30000
  data:
    redis:
      host: localhost
      port: 6379

supabase:
  project-ref: ${SUPABASE_PROJECT_REF}
  url: https://${SUPABASE_PROJECT_REF}.supabase.co
  public-key: ${SUPABASE_PUBLIC_KEY}
  secret-key: ${SECRET_KEY}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:fotos-perfil}
    s3-endpoint: ${SUPABASE_S3_ENDPOINT:https://${SUPABASE_PROJECT_REF}.storage.supabase.co/storage/v1/s3}
    region: ${SUPABASE_S3_REGION:sa-east-1}
    access-key: ${SUPABASE_S3_ACCESS_KEY:}
    secret-key: ${SUPABASE_S3_SECRET_KEY:}
