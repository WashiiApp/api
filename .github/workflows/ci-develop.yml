name: CI - develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: washii_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d washii_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/washii_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SUPABASE_PROJECT_REF: ci-test
      SECRET_KEY: ci-test-secret

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Java 25 e cache Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes e gerar JAR
        run: bash ./mvnw --batch-mode --no-transfer-progress package
      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v7
        with:
          name: washii-api-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
